name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-dryrun"

jobs:
  create-release:
    name: Create GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check CRATES_IO_TOKEN
        if: ${{ !endsWith(github.ref, '-dryrun') }}
        env:
          TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -eu
          if [ -z "${TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN 未注入：确认组织级 Secret 已授权给 dayu-sec/wist-stack-tools（Repository access），或在本仓添加同名 Secret"
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: create-release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish (dry run)
        if: ${{ endsWith(github.ref, '-dryrun') }}
        run: cargo publish -p wist-stackcheck-core --dry-run
      - name: Cargo publish
        if: ${{ !endsWith(github.ref, '-dryrun') }}
        run: cargo publish -p wist-stackcheck-core --token ${{ secrets.CRATES_IO_TOKEN }}
