[package]
name = "wist-stackcheck-core"
version = "0.1.0" #@gxl:set(version)
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared engine for wist stack-level config checks: Flow Result v1, CLI, profiles, compose/ports/x509 helpers."
publish = false

[dependencies]
serde_json = "1"
toml = "0.8"
# 证书 SAN / 有效期解析：只读 PEM，不验签（验签是 openssl / 客户端的事）。
x509-parser = "0.16"
